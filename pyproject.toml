[project]
name = "rosatom-caselab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "myHikoboshi", email = "arhipov.sasha04@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
